services:
  discord_invite_bot:
    image: ghcr.io/wickedyoda/discord_invite_bot:latest
    container_name: discord_role_bot
    pull_policy: always
    env_file:
      - env.env
    ports:
      - "8090:8080"
      - "8091:8081"
    volumes:
      - ./data:/app/data
      - ./logs:/logs
      - ./env.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - /app/healthcheck.py
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
