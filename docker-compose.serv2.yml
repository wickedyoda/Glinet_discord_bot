services:
  discord_invite_bot:
    image: ghcr.io/wickedyoda/discord_invite_bot:latest
    container_name: discord_role_bot
    pull_policy: always
    env_file:
      - env.env
    ports:
      - "8090:8080"
      - "8091:8081"
    volumes:
      - ./data:/app/data
      - ./logs:/logs
      - ./env.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request,sys; we=os.getenv('WEB_ENABLED','true').strip().lower() not in {'0','false','no','off'};\nif not we: sys.exit(0); bind=os.getenv('WEB_BIND_HOST','0.0.0.0').strip() or '0.0.0.0'; host='127.0.0.1' if bind in {'0.0.0.0','::'} else bind; port=int(os.getenv('WEB_PORT','8080') or '8080'); r=urllib.request.urlopen(f'http://{host}:{port}/readyz', timeout=8); sys.exit(0 if r.status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
