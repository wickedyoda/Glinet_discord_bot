# Dependabot: keep the pinned dependencies moving without drowning the PR list.
#
# Everything here is pinned with `==` (requirements) or a digest-free tag (Dockerfile),
# so nothing moves on its own. Minor and patch bumps arrive as one grouped PR per
# ecosystem; a major bump gets its own PR because it is the one that needs reading.
#
# Security updates are separate and already enabled on the repository: they open a PR
# as soon as an advisory lands, regardless of this schedule.
version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    # Wait before adopting a release: most malicious or broken publishes are caught and
    # yanked within days, and an immediate bump is the whole attack window.
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 5
      semver-patch-days: 2
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "python"
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    # Wait before adopting a release: most malicious or broken publishes are caught and
    # yanked within days, and an immediate bump is the whole attack window.
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 5
      semver-patch-days: 2
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    # Wait before adopting a release: most malicious or broken publishes are caught and
    # yanked within days, and an immediate bump is the whole attack window.
    cooldown:
      default-days: 3
      semver-major-days: 14
      semver-minor-days: 5
      semver-patch-days: 2
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(deps)"
    labels:
      - "dependencies"
      - "docker"
