name: Build and Publish Docker image

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  packages: write

jobs:
  # --------------------------------------------------------------------------- #
  #  GATE 1: Security scans — MUST PASS before build
  # --------------------------------------------------------------------------- #
  bandit:
    name: Bandit Python Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: |
          bandit \
            -r app/ bot.py web_admin.py \
            -f json \
            -o bandit-results.json \
            -x tests/ \
            --severity-level medium \
            --confidence-level medium

      - name: Enforce Bandit (fail on HIGH)
        run: |
          bandit \
            -r app/ bot.py web_admin.py \
            -x tests/ \
            --severity-level high \
            --confidence-level high

  ci-integrity:
    name: CI Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate YAML
        run: |
          python3 -c "
          import yaml, sys, glob
          errors = 0
          for f in glob.glob('.github/workflows/*.yml'):
              try:
                  with open(f) as fh:
                      yaml.safe_load(fh)
                  print(f'OK: {f}')
              except Exception as e:
                  print(f'FAIL: {f}: {e}')
                  errors += 1
          sys.exit(1 if errors else 0)
          "

  # --------------------------------------------------------------------------- #
  #  GATE 2: Build — only runs if all gates above pass
  # --------------------------------------------------------------------------- #
  build:
    name: Build and Push
    needs:
      - bandit
      - ci-integrity
    runs-on: ubuntu-latest
    if: always() && needs.bandit.result == 'success' && needs.ci-integrity.result == 'success'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare variables
        id: vars
        run: |
          echo "DATE_TAG=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"
          echo "IMAGE=ghcr.io/${{ github.actor }}/glinet_discord_bot" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.vars.outputs.IMAGE }}:latest
            ${{ steps.vars.outputs.IMAGE }}:${{ steps.vars.outputs.DATE_TAG }}
          no-cache: true
