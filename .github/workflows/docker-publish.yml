name: CI And Docker Publish

# Single pipeline for pull requests and main. Every scan runs once per change, as
# a gating job of this workflow, and the image is only built when all of them pass.
#
# The scan workflows used to carry their own pull_request/push triggers as well as
# being callable, so wiring them in here would have run each of them twice per
# push. They now keep only workflow_call plus their weekly schedule, which still
# catches newly published CVEs and updated rules against unchanged code.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    # A release tag publishes the same image under its version, so a deployment can
    # pin 2.5 instead of chasing :latest.
    tags:
      - "v*"
  workflow_dispatch:

# A newer push to the same ref supersedes the previous run.
concurrency:
  group: ci-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# The workflow token is read-only. Each job raises only what it needs -- a called
# workflow can only reduce the caller's grant, so the write lives on the calling job.
permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------- #
  #  GATES -- each is a reusable workflow; all must succeed before the build
  # --------------------------------------------------------------------------- #
  ci-integrity:
    name: CI Integrity
    uses: ./.github/workflows/ci-integrity.yml

  security-scan:
    name: Security Scan
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/security-scan.yml

  secret-scan:
    name: Secret Scan
    uses: ./.github/workflows/secret-scan.yml

  python-vuln-scan:
    name: Python Vulnerability Scan
    uses: ./.github/workflows/python-vulnerability-scan.yml

  container-security-scan:
    name: Container Security Scan
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/container-security-scan.yml

  dast-scan:
    name: Web DAST Scan
    uses: ./.github/workflows/dast-zap.yml

  # --------------------------------------------------------------------------- #
  #  BUILD -- only if every gate above passed
  # --------------------------------------------------------------------------- #
  build:
    name: Build and Push
    permissions:
      contents: read
      packages: write
      security-events: write
    needs:
      - ci-integrity
      - security-scan
      - secret-scan
      - python-vuln-scan
      - container-security-scan
      - dast-scan
    runs-on: ubuntu-latest
    if: >-
      always() && !cancelled()
      && needs.ci-integrity.result == 'success'
      && needs.security-scan.result == 'success'
      && needs.secret-scan.result == 'success'
      && needs.python-vuln-scan.result == 'success'
      && needs.container-security-scan.result == 'success'
      && needs.dast-scan.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # 7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # 4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # 4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # 4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare variables
        id: vars
        run: |
          # The owner, not the actor: a Dependabot PR runs as `dependabot[bot]`, which
          # is not a legal image path, and buildx validates the tag even when it will
          # not push. Lowercased because GHCR requires it.
          OWNER="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/glinet_discord_bot"
          DATE_TAG="$(date +'%Y%m%d')"
          VERSION_TAG=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/v}"
          fi
          echo "IMAGE=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "DATE_TAG=${DATE_TAG}" >> "$GITHUB_OUTPUT"
          echo "VERSION_TAG=${VERSION_TAG}" >> "$GITHUB_OUTPUT"
          {
            echo "TAGS<<EOF"
            echo "${IMAGE}:latest"
            echo "${IMAGE}:${DATE_TAG}"
            if [ -n "${VERSION_TAG}" ]; then
              echo "${IMAGE}:${VERSION_TAG}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # 6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          # Pull requests build but never publish.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.vars.outputs.TAGS }}
          no-cache: true
