name: Build and Publish Docker image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  packages: write

jobs:
  # --------------------------------------------------------------------------- #
  #  GATE 1: Security scans — MUST PASS before build
  # --------------------------------------------------------------------------- #
  bandit:
    name: Bandit Python Security
    uses: ./.github/workflows/security-scan.yml

  secret-scan:
    name: Secret Scan
    uses: ./.github/workflows/secret-scan.yml

  python-vuln-scan:
    name: Python Vulnerability Scan
    uses: ./.github/workflows/python-vulnerability-scan.yml

  dependency-review:
    name: Dependency Review
    uses: ./.github/workflows/dependency-review.yml

  ci-integrity:
    name: CI Integrity
    uses: ./.github/workflows/ci-integrity.yml

  container-security-scan:
    name: Container Security Scan
    uses: ./.github/workflows/container-security-scan.yml

  # --------------------------------------------------------------------------- #
  #  GATE 2: Build — only runs if all gates above pass
  # --------------------------------------------------------------------------- #
  build:
    name: Build and Push
    needs:
      - bandit
      - secret-scan
      - python-vuln-scan
      - dependency-review
      - ci-integrity
      - container-security-scan
    runs-on: ubuntu-latest
    if: always() && needs.bandit.result == 'success' && needs.secret-scan.result == 'success' && needs.python-vuln-scan.result == 'success' && needs.dependency-review.result == 'success' && needs.ci-integrity.result == 'success' && needs.container-security-scan.result == 'success'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare variables
        id: vars
        run: |
          echo "DATE_TAG=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"
          echo "IMAGE=ghcr.io/${{ github.actor }}/glinet_discord_bot" >> "$GITHUB_OUTPUT"

      - name: Print PR info
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: "${{ github.event.pull_request.title }}"
          PR_BODY: "${{ github.event.pull_request.body }}"
        run: |
          echo "🔖 PR Title: ${PR_TITLE}"
          echo "📝 PR Body: ${PR_BODY}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.vars.outputs.IMAGE }}:latest
            ${{ steps.vars.outputs.IMAGE }}:${{ steps.vars.outputs.DATE_TAG }}
          no-cache: true
