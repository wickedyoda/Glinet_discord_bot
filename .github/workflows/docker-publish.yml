name: Build and Publish Docker image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  packages: write

jobs:
  # --------------------------------------------------------------------------- #
  #  GATE 1: Security scans — MUST PASS before build
  # --------------------------------------------------------------------------- #
  bandit:
    name: Bandit Python Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: |
          bandit \
            -r app/ bot.py web_admin.py \
            -f json \
            -o bandit-results.json \
            -x tests/ \
            --severity-level medium \
            --confidence-level medium

      - name: Enforce Bandit (fail on HIGH)
        run: |
          bandit \
            -r app/ bot.py web_admin.py \
            -x tests/ \
            --severity-level high \
            --confidence-level high

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  python-vuln-scan:
    name: Python Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          pip-audit \
            --requirement requirements.txt \
            --strict \
            --severity-level high

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    steps:
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  ci-integrity:
    name: CI Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate YAML
        run: |
          pip install yamllint
          yamllint -c .yamllint.yml .github/workflows/

      - name: Check for debug statements
        run: |
          if grep -rn "pdb\|breakpoint\|console.log\|debugger" --include="*.py" app/ bot.py web_admin.py; then
            echo "Debug statements found"
            exit 1
          fi

  # --------------------------------------------------------------------------- #
  #  GATE 2: Build — only runs if all gates above pass
  # --------------------------------------------------------------------------- #
  build:
    name: Build and Push
    needs:
      - bandit
      - secret-scan
      - python-vuln-scan
      - dependency-review
      - ci-integrity
    runs-on: ubuntu-latest
    if: always() && needs.bandit.result == 'success' && needs.secret-scan.result == 'success' && needs.python-vuln-scan.result == 'success' && needs.dependency-review.result == 'success' && needs.ci-integrity.result == 'success'
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare variables
        id: vars
        run: |
          echo "DATE_TAG=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"
          echo "IMAGE=ghcr.io/${{ github.actor }}/glinet_discord_bot" >> "$GITHUB_OUTPUT"

      - name: Print PR info
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: "${{ github.event.pull_request.title }}"
          PR_BODY: "${{ github.event.pull_request.body }}"
        run: |
          echo "🔖 PR Title: ${PR_TITLE}"
          echo "📝 PR Body: ${PR_BODY}"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.vars.outputs.IMAGE }}:latest
            ${{ steps.vars.outputs.IMAGE }}:${{ steps.vars.outputs.DATE_TAG }}
          no-cache: true
