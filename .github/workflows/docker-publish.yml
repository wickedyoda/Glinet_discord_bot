name: CI And Docker Publish

# Single pipeline for pull requests and main. Every scan runs once per change, as
# a gating job of this workflow, and the image is only built when all of them pass.
#
# The scan workflows used to carry their own pull_request/push triggers as well as
# being callable, so wiring them in here would have run each of them twice per
# push. They now keep only workflow_call plus their weekly schedule, which still
# catches newly published CVEs and updated rules against unchanged code.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

# A newer push to the same ref supersedes the previous run.
concurrency:
  group: ci-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Called workflows can only reduce these, so grant the union they need.
permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  # --------------------------------------------------------------------------- #
  #  GATES -- each is a reusable workflow; all must succeed before the build
  # --------------------------------------------------------------------------- #
  ci-integrity:
    name: CI Integrity
    uses: ./.github/workflows/ci-integrity.yml

  security-scan:
    name: Security Scan
    uses: ./.github/workflows/security-scan.yml

  secret-scan:
    name: Secret Scan
    uses: ./.github/workflows/secret-scan.yml

  python-vuln-scan:
    name: Python Vulnerability Scan
    uses: ./.github/workflows/python-vulnerability-scan.yml

  container-security-scan:
    name: Container Security Scan
    uses: ./.github/workflows/container-security-scan.yml

  dast-scan:
    name: Web DAST Scan
    uses: ./.github/workflows/dast-zap.yml

  # --------------------------------------------------------------------------- #
  #  BUILD -- only if every gate above passed
  # --------------------------------------------------------------------------- #
  build:
    name: Build and Push
    needs:
      - ci-integrity
      - security-scan
      - secret-scan
      - python-vuln-scan
      - container-security-scan
      - dast-scan
    runs-on: ubuntu-latest
    if: >-
      always() && !cancelled()
      && needs.ci-integrity.result == 'success'
      && needs.security-scan.result == 'success'
      && needs.secret-scan.result == 'success'
      && needs.python-vuln-scan.result == 'success'
      && needs.container-security-scan.result == 'success'
      && needs.dast-scan.result == 'success'

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # 5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # 3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # 3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # 3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare variables
        id: vars
        run: |
          echo "DATE_TAG=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"
          echo "IMAGE=ghcr.io/${{ github.actor }}/glinet_discord_bot" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # 6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          # Pull requests build but never publish.
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.vars.outputs.IMAGE }}:latest
            ${{ steps.vars.outputs.IMAGE }}:${{ steps.vars.outputs.DATE_TAG }}
          no-cache: true
