name: SBOM Generate

on:
  pull_request:
    branches:
      - main
      - beta
  push:
    branches:
      - main
      - beta
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # 7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # 7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install CycloneDX tool
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock.txt

      - name: Generate dependency SBOM
        run: cyclonedx-py requirements -i requirements.txt -o sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # 7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
