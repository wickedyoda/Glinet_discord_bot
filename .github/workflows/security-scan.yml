name: Security Scan

on:
  push:
    branches:
      - main
      - beta
  pull_request:
    branches:
      - main
      - beta
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  security-events: write

jobs:
  bandit:
    name: Bandit Python Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # 5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # 6
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit bandit-sarif-formatter

      - name: Run Bandit
        run: |
          bandit \
            -r app/ bot.py web_admin.py \
            -f json \
            -o bandit-results.json \
            -x tests/ \
            --severity-level medium \
            --confidence-level medium

      - name: Enforce Bandit (fail on HIGH)
        run: |
          bandit \
            -r app/ bot.py web_admin.py \
            -x tests/ \
            --severity-level high \
            --confidence-level high

  semgrep:
    name: Semgrep Security Analysis
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # 5

      # Reviewed false-positive exclusions.
      #
      # Every rule below was verified by reading the flagged source, not by
      # assuming the pattern was safe. `--exclude-rule` is the Semgrep-native
      # mechanism for this; a rules file containing only `id` + `paths` is NOT
      # valid (semgrep-core requires a `pattern`), so the exclusions live here.
      #
      # Rules that were genuinely fixed are deliberately absent so they remain
      # enforced:
      #   - github-actions-mutable-action-tag -> every uses: pinned to a 40-char SHA
      #   - open-redirect                     -> redirect query params allow-listed
      #
      # A new alert for one of these rule ids in code that does not match the
      # reviewed reasoning is a genuine finding: re-enable the rule and fix it.
      #
      #   raw-html-format (flask + django)
      #     The admin UI is rendered as server-built HTML strings
      #     (render_template_string + f-strings). Interpolated values from user
      #     input, the DB, or external APIs are passed through html.escape() at
      #     the point of rendering; the rule flags the outer f-string itself.
      #   sqlalchemy-execute-raw-query
      #     Only hardcoded-whitelist column names are interpolated; every value
      #     is bound through ? placeholders. app/irc_bridge_store.py:121,124,171,174
      #     and app/guild_state.py:203,503.
      #   unverified-ssl-context
      #     Explicit admin UPTIME_STATUS_VERIFY_TLS override on a connection that
      #     is already validated to a public IP and pinned to the resolved address.
      #   nan-injection
      #     bool() over an HTML checkbox; never parsed as a float.
      #   insecure-file-permissions
      #     The flagged chmod calls are the 0o700/0o600 hardening path.
      #   dynamic-urllib-use-detected
      #     urlopen targets a validated admin-configured host (nosec B310 in place).
      #   render-template-string
      #     render_template_string is this project's intentional rendering strategy.
      #   directly-returned-format-string
      #     The same HTML-builder pattern as raw-html-format.
      - name: Run Semgrep
        run: |
          semgrep \
            --config=auto \
            --config=p/security-audit \
            --config=p/secrets \
            --exclude-rule=python.flask.security.injection.raw-html-concat.raw-html-format \
            --exclude-rule=python.django.security.injection.raw-html-format.raw-html-format \
            --exclude-rule=python.sqlalchemy.security.sqlalchemy-execute-raw-query.sqlalchemy-execute-raw-query \
            --exclude-rule=python.lang.security.unverified-ssl-context.unverified-ssl-context \
            --exclude-rule=python.flask.security.injection.nan-injection.nan-injection \
            --exclude-rule=python.lang.security.audit.insecure-file-permissions.insecure-file-permissions \
            --exclude-rule=python.lang.security.audit.dynamic-urllib-use-detected.dynamic-urllib-use-detected \
            --exclude-rule=python.flask.security.audit.render-template-string.render-template-string \
            --exclude-rule=python.flask.security.audit.directly-returned-format-string.directly-returned-format-string \
            --sarif \
            --output=semgrep-results.sarif \
            . || true

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # 4
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
