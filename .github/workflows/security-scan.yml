name: Security Scan

on:
  push:
    branches:
      - main
      - beta
  pull_request:
    branches:
      - main
      - beta
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
  workflow_call:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  security-events: write

jobs:
  bandit:
    name: Bandit Python Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # 5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # 6
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit bandit-sarif-formatter

      - name: Run Bandit
        run: |
          bandit \
            -r app/ bot.py web_admin.py \
            -f json \
            -o bandit-results.json \
            -x tests/ \
            --severity-level medium \
            --confidence-level medium

      - name: Enforce Bandit (fail on HIGH)
        run: |
          bandit \
            -r app/ bot.py web_admin.py \
            -x tests/ \
            --severity-level high \
            --confidence-level high

  semgrep:
    name: Semgrep Security Analysis
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # 5

      - name: Run Semgrep
        run: |
          semgrep \
            --config=auto \
            --config=p/security-audit \
            --config=p/secrets \
            --sarif \
            --output=semgrep-results.sarif \
            . || true

      - name: Apply reviewed false-positive suppressions
        # .semgrepignore.yml documents each suppression with the reasoning and
        # the exact call sites that were manually verified. Rules that were
        # genuinely fixed (action pinning, open-redirect) are intentionally
        # NOT listed there, so they keep being enforced.
        run: |
          semgrep \
            --config=.semgrepignore.yml \
            --sarif \
            --output=semgrep-suppressions.sarif \
            --metrics=off \
            --disable-version-check \
            --no-git-ignore \
            . || true

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # 4
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      - name: Upload reviewed suppressions
        # Uploaded as its own SARIF so GitHub records the suppressions as
        # accepted/dismissed state on the code-scanning page, rather than
        # silently dropping the findings.
        if: always() && hashFiles('semgrep-suppressions.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # 4
        with:
          sarif_file: semgrep-suppressions.sarif
          category: semgrep-reviewed-suppressions
