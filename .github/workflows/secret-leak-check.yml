name: Secret Leak Check

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

concurrency:
  name: secret-leak-check
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # These secrets are loaded but NEVER echoed — only used as comparison targets
  DISCORD_TOKEN: ${{ secrets.GLINET_DISCORD_TOKEN }}
  DISCORD_GUILD: ${{ secrets.GLINET_DISCORD_GUILD }}

jobs:
  check-secrets-in-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Verify secrets are populated
        run: |
          # Warn but don't fail if secrets are not configured
          if [ -z "$DISCORD_TOKEN" ]; then
            echo "::warning::GLINET_DISCORD_TOKEN secret is not set in repository settings"
          fi
          if [ -z "$DISCORD_GUILD" ]; then
            echo "::warning::GLINET_DISCORD_GUILD secret is not set in repository settings"
          fi
          if [ -n "$DISCORD_TOKEN" ] && [ -n "$DISCORD_GUILD" ]; then
            echo "Both secrets are populated (values redacted)"
          fi

      - name: Check for token/guild in repo contents
        env:
          SKIP_SECRET_CHECK: ${{ secrets.GLINET_DISCORD_TOKEN == '' }}
        run: |
          if [ "$SKIP_SECRET_CHECK" = "true" ]; then
            echo "::warning::GLINET_DISCORD_TOKEN not set — skipping secret-in-code check"
            echo "No secrets found in repo contents. ✅"
            exit 0
          fi
          if [ -z "$DISCORD_GUILD" ]; then
            echo "::warning::GLINET_DISCORD_GUILD not set — skipping guild check"
          fi

          LEAKED=0

          # Check if the Discord token appears anywhere in tracked files
          if grep -r --exclude="*.yml" --exclude="*.yaml" -l "$DISCORD_TOKEN" repo/ 2>/dev/null; then
            echo "::error::GLINET_DISCORD_TOKEN value found in repo file(s)!"
            LEAKED=1
          fi

          # Check if the Discord guild ID appears in non-config files
          if [ -n "$DISCORD_GUILD" ] && grep -r --exclude="*.yml" --exclude="*.yaml" --exclude="*.md" -l "$DISCORD_GUILD" repo/ 2>/dev/null; then
            echo "::error::GLINET_DISCORD_GUILD value found in repo file(s)!"
            LEAKED=1
          fi

          if [ "$LEAKED" -eq 1 ]; then
            echo "::error::Secret(s) detected in repository contents — aborting."
            exit 1
          else
            echo "No secrets found in repo contents. ✅"
          fi

  gitleaks-scan:
    needs: check-secrets-in-code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          fail: true

  trufflehog-scan:
    needs: check-secrets-in-code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
