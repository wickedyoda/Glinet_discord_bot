name: Secret Leak Check

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

concurrency:
  name: secret-leak-check
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # These secrets are loaded but NEVER echoed — only used as comparison targets
  DISCORD_TOKEN: ${{ secrets.GLINET_DISCORD_TOKEN }}
  DISCORD_GUILD: ${{ secrets.GLINET_DISCORD_GUILD }}

jobs:
  check-secrets-in-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Verify secrets are populated
        run: |
          # Fail early if secrets are not configured — don't proceed without them
          if [ -z "$DISCORD_TOKEN" ]; then
            echo "::error::GLINET_DISCORD_TOKEN secret is not set in repository settings"
            exit 1
          fi
          if [ -z "$DISCORD_GUILD" ]; then
            echo "::error::GLINET_DISCORD_GUILD secret is not set in repository settings"
            exit 1
          fi
          echo "Both secrets are populated (values redacted below)"

      - name: Check for token/guild in repo contents
        run: |
          LEAKED=0

          # Check if the Discord token appears anywhere in tracked files
          # Using grep with -r (recursive) and excluding the workflow file itself
          if grep -r --exclude="*.yml" --exclude="*.yaml" -l "$DISCORD_TOKEN" repo/ 2>/dev/null; then
            echo "::error::GLINET_DISCORD_TOKEN value found in repo file(s)!"
            LEAKED=1
          fi

          # Check if the Discord guild ID appears in non-config files
          # (env.example or docs are OK, but code/config should not contain it)
          if grep -r --exclude="*.yml" --exclude="*.yaml" --exclude="*.md" -l "$DISCORD_GUILD" repo/ 2>/dev/null; then
            echo "::error::GLINET_DISCORD_GUILD value found in repo file(s)!"
            LEAKED=1
          fi

          if [ "$LEAKED" -eq 1 ]; then
            echo "::error::Secret(s) detected in repository contents — aborting."
            exit 1
          else
            echo "No secrets found in repo contents. ✅"
          fi

  gitleaks-scan:
    needs: check-secrets-in-code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          config_path: .gitleaks.toml
          fail: true

  trufflehog-scan:
    needs: check-secrets-in-code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@v3
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
