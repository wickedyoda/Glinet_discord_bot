name: Discourse Integration Branch Protection

on:
  pull_request:
    branches:
      - discourse-integration
  push:
    branches:
      - discourse-integration
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  # --- Gate: CI Integrity ---
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff pytest
      - name: Run critical Ruff checks
        run: ruff check --select E9,F63,F7,F82 .
      - name: Compile Python sources
        run: python -m py_compile bot.py web_admin.py
      - name: Run tests if present
        shell: bash
        run: |
          if find . -type f \( -name "test_*.py" -o -name "*_test.py" \) | grep -q .; then
            pytest -q
          else
            echo "No tests discovered; skipping pytest."
          fi

  # --- Gate: Container Security Scan ---
  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Build Docker image
        run: docker build -t local/discord-invite-bot:${{ github.sha }}-discourse .
      - name: Install Trivy CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
          trivy --version
      - name: Generate Trivy SARIF report
        continue-on-error: true
        run: |
          trivy image \
            --db-repository "${{ env.TRIVY_DB_REPOSITORY }}" \
            --format sarif \
            --output trivy-image-discourse.sarif \
            --scanners vuln \
            --pkg-types os,library \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            local/discord-invite-bot:${{ github.sha }}-discourse
      - name: Upload Trivy SARIF to code scanning
        if: always() && hashFiles('trivy-image-discourse.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image-discourse.sarif
      - name: Enforce Trivy policy (critical vulnerabilities)
        run: |
          trivy image \
            --db-repository "${{ env.TRIVY_DB_REPOSITORY }}" \
            --format table \
            --scanners vuln \
            --pkg-types os,library \
            --severity CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            local/discord-invite-bot:${{ github.sha }}-discourse

      # --- Gate: Dependency Review ---
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Dependency review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  # --- Gate: Python Vulnerability Scan ---
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt --progress-spinner off

  # --- Gate: Secret Scan ---
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- Gate: Build & Publish Discourse-tagged Image (in docker-publish-discourse.yml) ---
