name: Secret Scan

on:
  # Called as a gating job by docker-publish.yml (PR + push to main).
  # No standalone pull_request/push trigger -- that would run it twice per change.
  workflow_call:
  workflow_dispatch:
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # 5
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # 2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
