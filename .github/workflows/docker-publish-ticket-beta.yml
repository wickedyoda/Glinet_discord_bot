name: (ticket-beta) Build and publish Docker image to GHCR

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional custom tag suffix"
        required: false
        default: ""
  push:
    branches:
      - ticket-bot

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare variables
        id: vars
        run: |
          echo "DATE_TAG=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"
          echo "TIME_TAG=$(date +'%H%M%S')" >> "$GITHUB_OUTPUT"
          echo "IMAGE=ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name | lower }}-ticket-beta" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.vars.outputs.IMAGE }}:${{ steps.vars.outputs.DATE_TAG }}-${{ steps.vars.outputs.TIME_TAG }}
            ${{ steps.vars.outputs.IMAGE }}:latest-ticket-beta
            ${{ steps.vars.outputs.IMAGE }}:${{ inputs.image_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ github.event.repository.updated_at || github.event.head_commit.timestamp || '' }}

      - name: Image digest
        run: |
          echo "Pushed tag: ${{ steps.vars.outputs.IMAGE }}:${{ steps.vars.outputs.DATE_TAG }}-${{ steps.vars.outputs.TIME_TAG }}"
