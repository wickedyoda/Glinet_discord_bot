name: OSSF Scorecards

on:
  workflow_dispatch:
  schedule:
    - cron: "35 3 * * 1"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  actions: read
  contents: read
  id-token: write
  security-events: write

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # 5
        with:
          persist-credentials: false

      - name: Run OSSF Scorecards
        uses: ossf/scorecard-action@dc50aa9510b46c811795eb24b2f1ba02a914e534  # 2.3.3
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          publish_results: true

      - name: Upload Scorecards SARIF
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # 4
        with:
          sarif_file: results.sarif

      - name: Upload Scorecards artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # 4
        with:
          name: scorecards-sarif
          path: results.sarif
