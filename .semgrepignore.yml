# Semgrep rule suppressions for verified false positives.
#
# Each entry below was reviewed by hand against the source. They are NOT
# blanket suppressions: the underlying pattern remains present and is still
# valid in other contexts — these are the specific rule classes that this
# repository's established, reviewed patterns trip.

rules:
  # ---------------------------------------------------------------------------
  # python.flask.security.injection.raw-html-concat.raw-html-format
  # python.django.security.injection.raw-html-format.raw-html-format
  #
  # This app renders its admin UI as server-built HTML strings (Flask
  # render_template_string + f-strings) rather than Jinja templates. Every
  # interpolated value that originates from user input, the database, or an
  # external API is passed through html.escape() at the point it is rendered,
  # e.g. app/web_freshdesk_routes.py renders
  #   f"#{t['id']} - {escape(t['subject'])}</a>"
  # The rule flags the outer f-string composition itself, so it fires on
  # every HTML builder in the codebase regardless of escaping.
  # ---------------------------------------------------------------------------
  - id: python.flask.security.injection.raw-html-concat.raw-html-format
    paths:
      - web_admin.py
      - app/web_freshdesk_routes.py
      - app/web_discourse_routes.py

  - id: python.django.security.injection.raw-html-format.raw-html-format
    paths:
      - web_admin.py
      - app/web_freshdesk_routes.py
      - app/web_discourse_routes.py

  # ---------------------------------------------------------------------------
  # python.sqlalchemy.security.sqlalchemy-execute-raw-query.sqlalchemy-execute-raw-query
  #
  # The flagged statements interpolate only column names that come from a
  # hardcoded whitelist literal in the same function (allowed / persisted_columns /
  # selected_columns), and every value is bound through `?` placeholders. No
  # request data ever reaches the SQL text. Verified in:
  #   app/irc_bridge_store.py:121,124,171,174
  #   app/guild_state.py:203,503
  # ---------------------------------------------------------------------------
  - id: python.sqlalchemy.security.sqlalchemy-execute-raw-query.sqlalchemy-execute-raw-query
    paths:
      - app/irc_bridge_store.py
      - app/guild_state.py

  # ---------------------------------------------------------------------------
  # python.lang.security.unverified-ssl-context.unverified-ssl-context
  #
  # web_admin.py builds an unverified context only when the admin-controlled
  # UPTIME_STATUS_VERIFY_TLS toggle is explicitly off, and the caller has
  # already validated the target is a public, non-private IP and pins the
  # connection to the pre-resolved address to prevent DNS rebinding.
  # This is the documented, deliberate admin override.
  # ---------------------------------------------------------------------------
  - id: python.lang.security.unverified-ssl-context.unverified-ssl-context
    paths:
      - web_admin.py

  # ---------------------------------------------------------------------------
  # python.flask.security.injection.nan-injection.nan-injection
  #
  # `bool(request.form.get("remember_login"))` coerces a checkbox value; it is
  # not parsed as a float, so NaN cannot propagate. The rule keys on any
  # bool() over request data.
  # ---------------------------------------------------------------------------
  - id: python.flask.security.injection.nan-injection.nan-injection
    paths:
      - web_admin.py

  # ---------------------------------------------------------------------------
  # python.lang.security.audit.insecure-file-permissions.insecure-file-permissions
  # python.lang.security.audit.dynamic-urllib-use-detected
  # python.flask.security.audit.render-template-string
  # python.flask.security.audit.directly-returned-format-string
  #
  # Audit-tier heuristics rather than exploitable findings:
  #  - the chmod calls are the *hardening* path (0o700/0o600), not a weak mode
  #  - the urlopen calls target a validated, admin-configured host and already
  #    carry a `# nosec B310` justification
  #  - render_template_string is the project's intentional rendering strategy
  #  - directly-returned-format-string is the HTML-builder pattern above
  # ---------------------------------------------------------------------------
  - id: python.lang.security.audit.insecure-file-permissions.insecure-file-permissions
    paths:
      - web_admin.py

  - id: python.lang.security.audit.dynamic-urllib-use-detected.dynamic-urllib-use-detected
    paths:
      - healthcheck.py
      - app/translate.py

  - id: python.flask.security.audit.render-template-string.render-template-string
    paths:
      - web_admin.py

  - id: python.flask.security.audit.directly-returned-format-string.directly-returned-format-string
    paths:
      - web_admin.py
